daemon off;

error_log /dev/stdout info;

user nginx;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen ${RTMP_PORT};
        chunk_size 4000;
        notify_method get;
        # HOAST360 patch: 4K H.264 keyframes exceed the 1M default ("too big message")
        max_message 10M;

        application live {
            live on;
            # Align track starts for the exec'd transcoder below. Without
            # these, a subscriber joining the live stream receives audio
            # immediately but no decodable video until the next keyframe,
            # so ffmpeg sees the video track start up to one GOP after the
            # audio and the DASH muxer records that skew as a leading empty
            # edit (elst media_time -1) on the video track. Players that do
            # not apply that edit through MSE (Chromium, Safari) then play
            # video early by the same amount. wait_key starts the relayed
            # video at a keyframe; wait_video holds audio until video flows.
            # Measured on the consuming deployment's restart-loop run: empty
            # edit 1.6-2.0 s on 10/10 joins without these, absent
            # (elst [(0,0)], A/V within 3 ms) with them, 20/20 encoder
            # restarts.
            wait_key on;
            wait_video on;
            on_publish http://127.0.0.1/route_to_auth;
            # -b:a is explicit only to state the rate, not to change it:
            # libopus targets 64 kb/s per uncoupled stream, which for 16
            # discrete channels under mapping_family 255 is exactly 1024k,
            # the value it was already picking silently. Literal, not a
            # ${VAR}: envsubst here whitelists only variables present in the
            # container env, so an undeclared one would reach ffmpeg raw and
            # kill the transcode. It precedes ${FFMPEG_FLAGS} so a later
            # -b:a there still wins.
            # $name is the PUBLISH name; it arrives from the public :1935 leg
            # (via rtmp-ingest) and an attacker fully controls it. It is safe as
            # the -i input: there it is an RTMP playpath consumed by a client
            # library (execve argv, not a shell, not a filesystem path), so it
            # can only self-pull the stream that was just relayed here. It is
            # NOT safe in the OUTPUT path: ffmpeg's dash muxer writes the
            # manifest and every segment relative to that path's dirname, so an
            # interpolated $name (e.g. ../../tmp/x) was an arbitrary-path write.
            # The output name is fixed by ${DASH_NAME}, substituted from the
            # container env at start and validated in entrypoint.sh; it is never
            # network-derived. Keeping $name on -i (not a second constant) means
            # the re-pull always matches the stream that was actually published.
            #
            # The second input, anullsrc, becomes a third AdaptationSet: silent
            # stereo at 8 kb/s, the keep-alive track. WebKit suspends a
            # backgrounded <video> element unless it has a decodable audio
            # track AND is unmuted, and the policy is per element, so a silent
            # <audio> elsewhere on the page does not count. Safari drops the
            # 16-channel Opus set as undecodable before dash.js sees it (the
            # programme audio reaches the listener through the player's own
            # decoder feed, not the element), so the element carried no audio
            # track at all and audio stopped about 2 s after the viewer
            # switched Space or tab. Measured three times over on macOS Safari
            # 27: muted with no track suspends, unmuted with no track suspends,
            # unmuted with a silent track keeps decoding. The codec comes from
            # the entrypoint (KEEPALIVE_CODEC): AAC in fMP4, the one audio
            # codec Safari's MSE accepts there (it reports Opus-in-MP4 as
            # unsupported), and Opus on the WebM opt-in, whose muxer refuses
            # AAC at header time and takes the whole transcode down with it.
            # What that does to the line: stream selection is explicit (-map),
            # because ffmpeg's default keeps ONE audio stream per output, the
            # one with the most channels, and would drop the keep-alive
            # silently; every audio option carries a stream index (:a:0 the
            # Opus programme, :a:1 the keep-alive) so nothing meant for
            # libopus reaches the other encoder; and -shortest is what ends the
            # transcode when the publisher stops, because anullsrc is
            # infinite. Without it ffmpeg outlived a closed input and the
            # silent track ran away at 328x realtime (chunk-stream2-58938 on
            # disk while the live tracks had stopped at 11). Its cost, measured
            # on a 20 s input: 888 samples (18 ms) off the Opus tail and no
            # change to the first-chunk time (+2 s with and without, at -re).
            # The keep-alive's own options sit AFTER ${FFMPEG_FLAGS} on
            # purpose: ffmpeg applies the last matching option, so a plain -b:a
            # placed there (the documented delivery-bitrate override) still
            # wins for the Opus stream and cannot inflate the silence too.
            exec ffmpeg -analyzeduration 10M -i rtmp://127.0.0.1/live/$name -f lavfi -i anullsrc=r=48000:cl=stereo -map 0:v:0 -map 0:a:0 -map 1:a:0 -strict -2 -c:a:0 libopus -mapping_family:a:0 255 -b:a:0 1024k -shortest ${FFMPEG_FLAGS} -c:a:1 ${KEEPALIVE_CODEC} -b:a:1 8k -ac:a:1 2 -f dash /opt/data/dash/${DASH_NAME}.mpd 2>>/tmp/nginx_rtmp_ffmpeg_log;
        }
    }
}

http {
    access_log /dev/stdout combined;

    include mime.types;
    sendfile on;

    limit_req_zone $arg_addr zone=antiBruteForce:100k rate=1r/s;
    limit_req_status 401;

    server {
        # Emit RELATIVE redirects. Otherwise nginx rebuilds a directory redirect
        # (e.g. /webtools -> /webtools/) using its internal listen port, dropping
        # the external mapped port (e.g. 8081) behind a Docker/Tailscale bind and
        # sending the browser to the wrong URL.
        absolute_redirect off;

        listen ${HTTP_PORT};

        location / {
             if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                #
                # Custom headers and headers various browsers *should* be OK with but aren't
                #
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                #
                # Tell client that this pre-flight info is valid for 20 days
                #
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
             }
             if ($request_method = 'POST') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
             }
             if ($request_method = 'GET') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
             }
        }

        location = / {
            return 200 'Health Check reply';
            # because default content-type is application/octet-stream,
            # browser will offer to "save the file"...
            # if you want to see reply in browser, uncomment next line
            # add_header Content-Type text/plain;
        }
        location /dash {
            types {
                application/dash+xml mpd;
                video/mp4 mp4;
            }
            root /opt/data;

            # earshot writes one fixed manifest (${DASH_NAME}.mpd); the webtools preview
            # requests /dash/<streamname>.mpd and would 404. Map any .mpd request to the
            # real manifest (segments are referenced relatively, so they resolve unchanged).
            rewrite ^/dash/[^/]+\.mpd$ /dash/${DASH_NAME}.mpd break;

            # modify these if you need different CORS settings
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Expose-Headers Content-Length;
        }

        # check auth token sent by RTMP encoder
        location /auth {
            if ($arg_token = '${RTMP_AUTH_TOKEN}') {
                return 201;
            }
            return 401;
        }

        #forward to custom rtmp auth url
        location /route_to_auth {
            limit_req zone=antiBruteForce burst=2 nodelay;
            allow 127.0.0.1;
            deny all;
            proxy_pass  ${RTMP_AUTH_URL};
        }

        location = /crossdomain.xml {
            root /www/static;
            default_type text/xml;
            expires 24h;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet static/stat.xsl;
        }

        location /static/ {
            alias /www/static;
        }

        # static nginx runtime info served to webtools
        location /nginxInfo {
            default_type application/json;
            return 200 '{"ffmpegFlags":"${FFMPEG_FLAGS}","dashName":"${DASH_NAME}"}';
        }

        location /webtools {
            root /www;
        }

        # uncomment this and comment above /webtools section for local webtools development / webpack hot reload
        # location /webtools {
        #     proxy_pass http://host.docker.internal:3000;
        #     proxy_redirect off;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        # }

        # location /sockjs-node {
        #     proxy_pass http://host.docker.internal:3000;
        #     proxy_redirect off;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        # }
    }
}
